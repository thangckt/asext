### REF: https://github.com/pypa/gh-action-pypi-publish
### https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml
### This action upload the wheel to PyPI every push

name: upload_wheel_to_PyPI

on:
  workflow_dispatch:
  push:
    branches: [main, wheel]

jobs:
  upload_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # if: github.event_name == 'release' && github.event.action == 'published'
    # if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/dev') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - uses: actions/checkout@v4

      - uses: pypa/gh-action-pypi-publish@release/v1
        # with:
        #   To test: repository-url: https://test.pypi.org/legacy/
        #   path: dist/